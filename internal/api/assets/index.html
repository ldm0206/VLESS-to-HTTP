<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>v2h 控制面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23C96442'/%3E%3Ctext%20x='16'%20y='23'%20font-family='Georgia,serif'%20font-size='19'%20fill='%23FAF9F5'%20text-anchor='middle'%3Ev%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>

<div id="boot" class="boot"><span class="spinner"></span><span>正在加载面板…</span></div>

<!-- Login -->
<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-head">
      <div class="wordmark">v2h</div>
      <p class="login-sub">Clash 订阅驱动的主机代理控制面板</p>
    </div>
    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input id="login-user" name="username" type="text" autocomplete="username" autofocus>
      </label>
      <label class="field">
        <span>密码</span>
        <input id="login-pass" name="password" type="password" autocomplete="current-password">
      </label>
      <div id="turnstile-slot" class="turnstile-slot" hidden></div>
      <p id="login-error" class="login-error" hidden></p>
      <button id="login-submit" class="btn btn-primary btn-block" type="submit">登录</button>
      <p id="login-hint" class="field-hint login-hint" hidden></p>
    </form>
    <div class="login-foot" id="login-version"></div>
  </div>
</div>

<!-- Application shell -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="wordmark brand-mark">v2h</span></div>
    <nav class="nav" id="nav">
      <a class="nav-item" href="#/overview" data-route="overview" title="概览">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-label">概览</span>
      </a>
      <a class="nav-item" href="#/users" data-route="users" title="账号">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
        <span class="nav-label">账号</span>
      </a>
      <a class="nav-item" href="#/subs" data-route="subs" title="订阅">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 14.5l5-5"/><path d="M7.5 11.5l-1.6 1.6a3.5 3.5 0 0 0 5 5l1.6-1.6"/><path d="M16.5 12.5l1.6-1.6a3.5 3.5 0 0 0-5-5l-1.6 1.6"/></svg>
        <span class="nav-label">订阅</span>
      </a>
      <a class="nav-item" href="#/nodes" data-route="nodes" title="节点">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
        <span class="nav-label">节点</span>
      </a>
      <a class="nav-item" href="#/logs" data-route="logs" title="日志">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h16M4 10h16M4 14.5h11M4 19h7"/></svg>
        <span class="nav-label">日志</span>
      </a>
      <a class="nav-item" href="#/settings" data-route="settings" title="设置">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/></svg>
        <span class="nav-label">设置</span>
      </a>
      <a class="nav-item" href="#/help" data-route="help" title="帮助">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.3 2.4c-.6.25-.9.7-.9 1.3v.4"/><path d="M12 17h.01"/></svg>
        <span class="nav-label">帮助</span>
      </a>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <h1 class="page-title" id="page-title">概览</h1>
      <div class="topbar-actions">
        <span class="conn" id="conn-state"><span class="dot dot-grey"></span><span class="conn-label">连接中</span></span>
        <span class="topbar-sep" aria-hidden="true"></span>
        <button id="theme-toggle" class="btn btn-ghost" type="button" title="切换浅色 / 深色主题">深色</button>
        <button id="user-chip" class="btn btn-ghost" type="button" title="当前登录账号" disabled></button>
        <button id="logout" class="btn btn-outline" type="button">退出登录</button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

</body>
</html>
