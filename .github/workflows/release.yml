name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub Release
  packages: write # ghcr.io

env:
  IMAGE: ghcr.io/ldm0206/vless-to-http

jobs:
  # --------------------------------------------------------------------------
  # 多架构镜像 → ghcr.io/ldm0206/vless-to-http
  # --------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # provenance 关掉：多架构 manifest 里多一层 attestation 之后，
          # 一些老的 docker 客户端 / 面板会看不懂，也省一半推送量。
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.value }}

  # --------------------------------------------------------------------------
  # 裸二进制（linux / darwin / windows）→ GitHub Release
  # --------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          suffix=""
          if [ -n "${GOARM}" ]; then
            suffix="v${GOARM}"
          fi
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          name="v2h_${VERSION}_${GOOS}_${GOARCH}${suffix}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X github.com/ldm0206/vless-to-http/internal/version.Version=${VERSION} \
              -X github.com/ldm0206/vless-to-http/internal/version.Commit=${COMMIT} \
              -X github.com/ldm0206/vless-to-http/internal/version.Date=${built}" \
            -o "dist/${name}${ext}" ./cmd/v2h
          echo "已生成 dist/${name}${ext}"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: v2h-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
