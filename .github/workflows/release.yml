name: Publish

# 每次推送到 main 就发一版：跑完测试后构建多架构镜像推到 ghcr.io，
# 并把裸二进制作为 Actions 产物留下。
# 不依赖 tag，也不创建 GitHub Release（Release 必须挂在 tag 上）。
on:
  push:
    branches: [main]
  # 需要手工重发某次提交时用：Actions → Publish → Run workflow。
  workflow_dispatch:

permissions:
  contents: read # 不建 Release，只需要读代码
  packages: write # 推 ghcr.io

env:
  IMAGE: ghcr.io/ldm0206/vless-to-http

# 不用 cancel-in-progress：每次提交都要有自己的镜像，
# 半路取消会留下没推完的多架构 manifest。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 先验证，测试不过就不发版
  # --------------------------------------------------------------------------
  verify:
    name: vet / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race

      - name: go build
        run: go build ./...

  # --------------------------------------------------------------------------
  # 多架构镜像 → ghcr.io/ldm0206/vless-to-http:latest
  # 每次提交都会覆盖 latest，并留下一个不可变的 sha-<短提交号> 标签。
  # --------------------------------------------------------------------------
  docker:
    name: Docker image
    # 等二进制先出来：镜像只负责把预编译产物装进去，不再在 QEMU 里编译。
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the linux binaries
        uses: actions/download-artifact@v4
        with:
          # 只要三个 linux 产物；v2h-binaries 那个合并包不需要。
          pattern: v2h-linux-*
          path: prebuilt
          merge-multiple: true

      - name: Stage them under the names the Dockerfile expects
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          for f in prebuilt/v2h_${short}_linux_*; do
            arch="${f##*_linux_}"        # amd64 | arm64 | armv7
            cp "$f" "prebuilt/v2h-linux-${arch}"
            echo "prebuilt/v2h-linux-${arch} ← $(basename "$f")"
          done
          ls -la prebuilt/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version info
        id: version
        run: |
          set -euo pipefail
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=v2h
            org.opencontainers.image.description=多账号 HTTP / SOCKS5 代理，订阅驱动，Xray 内核内嵌
          # 不覆盖的话，包页面上显示的是仓库描述里的旧文案（还是旧的单链接代理）。
          annotations: |
            org.opencontainers.image.title=v2h
            org.opencontainers.image.description=多账号 HTTP / SOCKS5 代理：订阅驱动，按账号分流，Xray 内核内嵌，自带 Web 面板

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # provenance 关掉：多架构 manifest 里多一层 attestation 之后，
          # 一些老的 docker 客户端 / 面板会看不懂，也省一半推送量。
          provenance: false
          push: true
          # 层缓存：apk add 那层在每次提交之间可以复用。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # alpine 基础镜像里没有 Go 工具链，强制走 prebuilt/ 那条分支，
            # 避免在 QEMU 下编译整个 Xray 依赖树（arm/v7 要几十分钟）。
            BUILD_BASE=alpine:3.20
            VERSION=${{ steps.version.outputs.short }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}

  # --------------------------------------------------------------------------
  # 裸二进制：不建 Release，作为本次运行的产物上传（默认保留 90 天）
  # --------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          suffix=""
          if [ -n "${GOARM}" ]; then
            suffix="v${GOARM}"
          fi
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi

          short="$(git rev-parse --short=7 HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="v2h_${short}_${GOOS}_${GOARCH}${suffix}"

          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X github.com/ldm0206/vless-to-http/internal/version.Version=${short} \
              -X github.com/ldm0206/vless-to-http/internal/version.Commit=${GITHUB_SHA} \
              -X github.com/ldm0206/vless-to-http/internal/version.Date=${built}" \
            -o "dist/${name}${ext}" ./cmd/v2h
          echo "已生成 dist/${name}${ext}"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: v2h-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  collect:
    name: Collect binaries
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: v2h-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 90
